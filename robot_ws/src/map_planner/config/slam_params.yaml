slam_toolbox:
  ros__parameters:
    map_frame: map
    base_frame: racecar/base_link
    odom_frame: racecar/odom
    
    transform_timeout: 1.5
    message_queue_size: 800
    min_scan_frequency: 4.0
    max_queue_duration: 1.2
    use_sim_time: true
    queue_size: 100
    scan_queue_size: 100
     
    scan_topic: /scan
    max_laser_range: 30.0
    minimum_laser_range: 0.1

    resolution: 0.05

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    use_scan_matching: true
    use_scan_barycenter: true
    mode: "mapping"

    map_update_interval: 1.5
    lifetime: 10.0

    expand_map_when_bouncing: false
